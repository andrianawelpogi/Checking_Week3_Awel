<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Queue TV Display - Gearhead Auto Hub</title>
    <style>
        :root {
            --bg-main: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-surface-alt: #f8fafc;
            --border-color: #e2e8f0;
            --primary: #ea580c;
            --primary-soft: #ffedd5;
            --text-main: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --queue-bg: #fef3c7;
            --queue-text: #b45309;
            --service-bg: #e0f2fe;
            --service-text: #0369a1;
            --done-bg: #dcfce7;
            --done-text: #15803d;
            --font-sans: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Consolas', 'Courier New', monospace;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .tv-header {
            background-color: var(--bg-surface);
            border-bottom: 4px solid var(--primary);
            padding: 1rem 2.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .tv-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .tv-logo {
            width: 58px;
            height: 58px;
            background-color: var(--bg-surface-alt);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tv-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .tv-brand h1 {
            font-size: 1.75rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            line-height: 1.15;
            color: var(--text-main);
        }

        .tv-brand h1::before {
            content: "⚙ ";
            color: var(--primary);
        }

        .tv-brand p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .tv-stats {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .stat-pill {
            background-color: var(--bg-surface-alt);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.55rem 1rem;
            text-align: center;
            min-width: 120px;
        }

        .stat-pill span {
            display: block;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .stat-pill strong {
            font-family: var(--font-mono);
            font-size: 1.45rem;
            font-weight: 900;
        }

        .stat-waiting strong { color: var(--queue-text); }
        .stat-active strong { color: var(--service-text); }
        .stat-done strong { color: var(--done-text); }

        .tv-clock {
            text-align: right;
            font-family: var(--font-mono);
        }

        .tv-clock .time {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.1;
        }

        .tv-clock .date {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .tv-main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 1.5rem;
            padding: 1.5rem 2.25rem 2rem 2.25rem;
        }

        .tv-column {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            box-shadow: var(--shadow-card);
        }

        .column-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .column-title h2 {
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .tag-live {
            background-color: var(--primary-soft);
            color: var(--primary);
            border: 1px solid #fed7aa;
            padding: 0.25rem 0.7rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .serving-list {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .serving-card {
            background-color: var(--bg-surface-alt);
            border: 2px solid #0284c7;
            border-radius: 14px;
            padding: 1.15rem 1.35rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .serving-left {
            display: flex;
            align-items: center;
            gap: 1.15rem;
        }

        .big-queue-box {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: 900;
            background-color: var(--primary);
            color: #ffffff;
            padding: 0.55rem 0.95rem;
            border-radius: 12px;
            line-height: 1;
            flex-shrink: 0;
        }

        .serving-info h3 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.25;
        }

        .serving-info .service-name {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
        }

        .serving-info .mechanic-line {
            font-size: 0.88rem;
            color: var(--service-text);
            font-weight: 700;
            margin-top: 0.25rem;
        }

        .badge-tv {
            padding: 0.45rem 0.95rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .badge-servicing {
            background-color: var(--service-bg);
            color: var(--service-text);
        }

        .badge-queueing {
            background-color: var(--queue-bg);
            color: var(--queue-text);
        }

        .badge-done {
            background-color: var(--done-bg);
            color: var(--done-text);
        }

        .waiting-list,
        .done-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .tv-row {
            background-color: var(--bg-surface-alt);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.95rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .tv-row-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .row-q-num {
            font-family: var(--font-mono);
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--queue-text);
            background-color: var(--queue-bg);
            border: 1px solid #fde68a;
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            min-width: 84px;
            text-align: center;
        }

        .row-q-num.done-num {
            color: var(--done-text);
            background-color: var(--done-bg);
            border-color: #bbf7d0;
        }

        .row-details strong {
            display: block;
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .row-details span {
            display: block;
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        .tv-price {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            text-align: right;
        }

        .empty-tv {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.05rem;
            padding: 1.5rem 1rem;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            background-color: var(--bg-surface-alt);
        }

        .tv-footer {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            padding: 0.7rem 2.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        @media (max-width: 1024px) {
            .tv-main {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            .tv-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 1rem;
            }
            .tv-clock {
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <header class="tv-header">
        <div class="tv-brand">
            <div class="tv-logo">
                <img src="logo.png" alt="Gearhead Auto Hub Logo">
            </div>
            <div>
                <h1>Gearhead Auto Hub</h1>
                <p>Workshop Live Queue Board</p>
            </div>
        </div>

        <div class="tv-stats">
            <div class="stat-pill stat-active">
                <span>On Service</span>
                <strong id="tvServicingCount">0</strong>
            </div>
            <div class="stat-pill stat-waiting">
                <span>Queueing</span>
                <strong id="tvQueueingCount">0</strong>
            </div>
            <div class="stat-pill stat-done">
                <span>Ready / Done</span>
                <strong id="tvDoneCount">0</strong>
            </div>
        </div>

        <div class="tv-clock">
            <div id="liveTime" class="time">--:--:--</div>
            <div id="liveDate" class="date">Loading date...</div>
        </div>
    </header>

    <main class="tv-main">
        <section class="tv-column">
            <div class="column-title">
                <h2>Now Serving</h2>
                <span class="tag-live">In Workshop</span>
            </div>
            <div id="servingList" class="serving-list"></div>

            <div class="column-title" style="margin-top: 0.5rem;">
                <h2>Waiting in Queue</h2>
                <span class="tag-live">Up Next</span>
            </div>
            <div id="waitingList" class="waiting-list"></div>
        </section>

        <section class="tv-column">
            <div class="column-title">
                <h2>Ready for Pickup / Cashier</h2>
                <span class="tag-live">Completed</span>
            </div>
            <div id="doneList" class="done-list"></div>
        </section>
    </main>

    <footer class="tv-footer">
        <span>Please watch the screen for your Queue Number.</span>
        <span>Live sync active</span>
    </footer>

    <script>
        const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('gearhead_queue_channel') : null;

        function formatPeso(amount) {
            return '₱' + Number(amount || 0).toLocaleString('en-PH', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('liveTime').textContent = now.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('liveDate').textContent = now.toLocaleDateString([], {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function renderTvBoard() {
            const activeQueue = JSON.parse(localStorage.getItem('gearhead_active_queue') || '[]');
            const completedLog = JSON.parse(localStorage.getItem('gearhead_completed_log') || '[]');

            const servicingItems = activeQueue.filter(item => item.status === 'servicing');
            const queueingItems = activeQueue.filter(item => item.status !== 'servicing');

            document.getElementById('tvServicingCount').textContent = servicingItems.length;
            document.getElementById('tvQueueingCount').textContent = queueingItems.length;
            document.getElementById('tvDoneCount').textContent = completedLog.length;

            const servingList = document.getElementById('servingList');
            const waitingList = document.getElementById('waitingList');
            const doneList = document.getElementById('doneList');

            if (servicingItems.length === 0) {
                servingList.innerHTML = `<div class="empty-tv">No vehicles currently on service.</div>`;
            } else {
                servingList.innerHTML = servicingItems.map(item => `
                    <div class="serving-card">
                        <div class="serving-left">
                            <div class="big-queue-box">${item.queue}</div>
                            <div class="serving-info">
                                <h3>${item.customer}</h3>
                                <div class="service-name">${item.service}</div>
                                <div class="mechanic-line">Mechanic: ${item.mechanic || 'Assigned Mechanic'}</div>
                            </div>
                        </div>
                        <span class="badge-tv badge-servicing">On Service</span>
                    </div>
                `).join('');
            }

            if (queueingItems.length === 0) {
                waitingList.innerHTML = `<div class="empty-tv">No customers waiting in queue.</div>`;
            } else {
                waitingList.innerHTML = queueingItems.map(item => {
                    const total = (Number(item.basePrice) || 0) + (Number(item.extraCost) || 0);
                    return `
                        <div class="tv-row">
                            <div class="tv-row-left">
                                <div class="row-q-num">${item.queue}</div>
                                <div class="row-details">
                                    <strong>${item.customer}</strong>
                                    <span>${item.service}</span>
                                </div>
                            </div>
                            <div>
                                <span class="badge-tv badge-queueing">Still Queueing</span>
                                <div class="tv-price">${formatPeso(total)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            if (completedLog.length === 0) {
                doneList.innerHTML = `<div class="empty-tv">No completed vehicles waiting at cashier.</div>`;
            } else {
                doneList.innerHTML = completedLog.slice(0, 8).map(item => {
                    const total = (Number(item.basePrice) || 0) + (Number(item.extraCost) || 0);
                    return `
                        <div class="tv-row">
                            <div class="tv-row-left">
                                <div class="row-q-num done-num">${item.queue}</div>
                                <div class="row-details">
                                    <strong>${item.customer}</strong>
                                    <span>${item.service} • Finished ${item.timeFinished || ''}</span>
                                </div>
                            </div>
                            <div>
                                <span class="badge-tv badge-done">Proceed to Cashier</span>
                                <div class="tv-price">${formatPeso(total)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        if (channel) {
            channel.onmessage = (event) => {
                if (event.data) {
                    localStorage.setItem('gearhead_active_queue', JSON.stringify(event.data.activeQueue || []));
                    localStorage.setItem('gearhead_completed_log', JSON.stringify(event.data.completedLog || []));
                    renderTvBoard();
                }
            };
        }

        window.addEventListener('storage', renderTvBoard);
        updateClock();
        renderTvBoard();
        setInterval(updateClock, 1000);
        setInterval(renderTvBoard, 1000);
    </script>
</body>
</html>
